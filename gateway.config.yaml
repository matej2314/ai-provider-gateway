# Boilerplate — skopiuj do gateway.config.yaml i uruchom:
#   gateway config:init
#
# Plik przechodzi walidację schematu, ale CLI traktuje go jako placeholder
# (masterKeyRef / ID providerów / klientów zawierają "placeholder" lub "PLACEHOLDER")
# i uruchamia wizard bez pytania o nadpisanie.

schemaVersion: 1
masterKeyRef: MASTER_KEY_PLACEHOLDER

providers:
  placeholder-provider:
    type: anthropic
    apiKeyRef: PLACEHOLDER_PROVIDER_API_KEY
    enabled: true

clients:
  placeholder-client:
    name: Placeholder Client
    type: ide
    gatewayKeyRef: GATEWAY_KEY_PLACEHOLDER

models:
  placeholder-model:
    providerInstance: placeholder-provider
    modelId: placeholder-model
    policy:
      retry: {}
      params:
        defaults: {}
        allowOverrides: []
        bounds: {}
