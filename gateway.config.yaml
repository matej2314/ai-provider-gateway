# AI Provider Gateway - Configuration File (BOILERPLATE)
# 
# To jest plik z wartościami placeholder.
# Uruchom 'gateway config:init' aby zastąpić placeholders prawdziwymi wartościami.
#
# UWAGA: Ten boilerplate config przechodzi schema validation, ale ma:
# - Disabled providers (enabled: false)
# - Placeholder refs zamiast prawdziwych nazw env vars
# - Dummy IDs i nazwy modeli
#
# Aplikacja NIE WYSTARTUJE z tym boilerplate config (brak valid env vars).
# Musisz użyć CLI do konfiguracji przed pierwszym uruchomieniem.

schemaVersion: 1
masterKeyRef: "PLACEHOLDER_MASTER_KEY_REF"

providers:
  placeholder-anthropic:
    type: "anthropic"
    apiKeyRef: "PLACEHOLDER_ANTHROPIC_API_KEY"
    enabled: false  # disabled - to jest placeholder

  placeholder-google:
    type: "google"
    apiKeyRef: "PLACEHOLDER_GOOGLE_API_KEY"
    enabled: false  # disabled - to jest placeholder

clients:
  placeholder-client:
    name: "Placeholder Client (replace via CLI)"
    type: "webapp"
    gatewayKeyRef: "PLACEHOLDER_GATEWAY_KEY"

models:
  placeholder-model:
    providerInstance: "placeholder-anthropic"
    modelId: "placeholder-model-id"
    capabilities:
      streaming: true
    policy:
      timeoutMs: 30000
      retry:
        maxAttempts: 3
        onStatus: [429, 500, 502, 503, 504]
      params:
        defaults:
          temperature: 0.7
          maxOutputTokens: 1024
        allowOverrides: ["temperature", "maxOutputTokens"]
        bounds:
          temperature:
            min: 0
            max: 2
          maxOutputTokens:
            min: 1
            max: 8192