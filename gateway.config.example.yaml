schemaVersion: 1
masterKeyRef: MASTER_KEY_PLACEHOLDER

providers:
  placeholder-provider:
    type: anthropic
    apiKeyRef: ANTHROPIC_API_KEY_PLACEHOLDER
    enabled: true

clients:
  placeholder-client:
    name: Placeholder Client
    type: ide
    gatewayKeyRef: GATEWAY_KEY_PLACEHOLDER

models:
  placeholder-model:
    providerInstance: placeholder-provider
    modelId: placeholder-modelId
    capabilities:
      streaming: true
      tools: true
      thinking: true
    policy:
      timeoutMs: 30000
      retry:
        maxAttempts: 3
        onStatus:
          - 429
          - 500
          - 502
          - 503
          - 504
      params:
        defaults:
          temperature: 0.7
          maxOutputTokens: 4096
          thinkingEnabled: false
        allowOverrides:
          - temperature
          - maxOutputTokens
          - topP
          - topK
          - stop
          - frequencyPenalty
          - presencePenalty
          - seed
          - responseFormat
          - thinkingEnabled
          - thinkingBudget
        bounds:
          temperature:
            min: 0
            max: 2
          maxOutputTokens:
            min: 1
            max: 8192
          topP:
            min: 0
            max: 1
          frequencyPenalty:
            min: -2
            max: 2
          presencePenalty:
            min: -2
            max: 2
