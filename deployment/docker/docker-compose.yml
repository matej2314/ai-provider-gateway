name: ai-provider-gateway

# Base configuration: Gateway only
# To add Redis: docker-compose -f docker-compose.yml -f docker-compose.redis.yml up -d
# To add Monitoring: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Full stack: docker-compose -f docker-compose.yml -f docker-compose.redis.yml -f docker-compose.monitoring.yml up -d

services:
  gateway:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: production
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    env_file:
      - ../../.env
    environment:
      # Server
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health/ready', (r) => { let body = ''; r.on('data', (c) => body += c); r.on('end', () => { try { const j = JSON.parse(body); process.exit(r.statusCode === 200 && j.status === 'ready' ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - ai-gateway-network
    volumes:
      - ../../gateway.config.yaml:/app/gateway.config.yaml:ro # From root
      - ../../logs:/app/logs # Logs in root/logs/

networks:
  ai-gateway-network:
    external: true
    name: ai-gateway-network
