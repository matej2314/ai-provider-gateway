name: ai-provider-gateway-redis

# Standalone Redis (npm run redis:up) — ustaw w .env: CACHE_ENABLED=true, REDIS_HOST=redis
# Gateway + Redis: npm run docker:up:redis

services:
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6380:6379"
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-network
    volumes:
      - redis-data:/data

volumes:
  redis-data:

networks:
  ai-gateway-network:
    external: true
    name: ai-gateway-network
