name: ai-provider-gateway-redis

# Redis Stack gatewaya na porcie 6380 (wewnątrz kontenera i na hoście) —
# celowo nie 6379, żeby nie kolidować z innym Redisem na hoście.
# Vault / .env: REDIS_HOST=ai-gateway-redis (lub redis), REDIS_PORT=6380
# Gateway + Redis: npm run docker:up:redis
# UWAGA: nie nadpisuj command: — kasuje moduł Search (użyj REDIS_ARGS)
# Sanity: docker exec ai-gateway-redis redis-cli -p 6380 MODULE LIST | grep search
# Tag pinned (nie :latest) — spójny z test/integration/docker-compose.redis-stack.yml

services:
  gateway:
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: ai-gateway-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6380:6380"
    environment:
      REDIS_ARGS: '--port 6380 --maxmemory ${REDIS_MAX_MEMORY:-500mb} --maxmemory-policy noeviction'
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-gateway-network
    volumes:
      - redis-data:/data

volumes:
  redis-data:

networks:
  ai-gateway-network:
    external: true
    name: ai-gateway-network
