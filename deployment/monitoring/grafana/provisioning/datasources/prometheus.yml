# Grafana Datasource Provisioning Configuration
# Official docs: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://ai-gateway-prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      queryTimeout: 30s
      cacheLevel: 'Medium'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      disableRecordingRules: false
      manageAlerts: false
      prometheusType: Prometheus
