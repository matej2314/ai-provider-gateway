name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (current tip of this branch)'
        required: true
        default: feat/production-readiness
        type: string

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CONT_NAME: ai-provider-gateway
  VAULT_ADDR: https://vault-prod:8200
  VAULT_SKIP_VERIFY: 'true'
  VAULT_ENV: prod
  # Paths the Docker *daemon* bind-mounts — must exist on the host FS, not only
  # inside a containerized Actions runner (docker.sock / DooD).
  DEPLOY_DIR: /opt/ai-provider-gateway
  CI_WORKFLOW_FILE: ci.yml

jobs:
  deploy:
    name: Deploy full stack
    runs-on: [self-hosted, linux]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve deploy revision
        id: revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "ref=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: ${sha}"
          echo "Branch tip: ${{ inputs.branch }}"

      - name: Require green CI for deploy SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.revision.outputs.ref }}"
          API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/${CI_WORKFLOW_FILE}/runs?head_sha=${SHA}&per_page=20"

          echo "Checking CI (${CI_WORKFLOW_FILE}) for commit ${SHA} ..."
          response="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}")"

          if ! echo "${response}" | jq -e '.workflow_runs' >/dev/null 2>&1; then
            echo "Failed to query GitHub Actions API:"
            echo "${response}" | jq . 2>/dev/null || echo "${response}"
            exit 1
          fi

          echo "${response}" | jq '[.workflow_runs[] | {id, status, conclusion, event, html_url, created_at}]'

          success_count="$(echo "${response}" | jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")] | length')"
          in_progress="$(echo "${response}" | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')"

          if [ "${success_count}" -ge 1 ]; then
            echo "${response}" | jq -r '
              .workflow_runs[]
              | select(.status=="completed" and .conclusion=="success")
              | "OK: green CI run \(.id) (\(.event)) — \(.html_url)"
            ' | head -n 1
            exit 0
          fi

          if [ "${in_progress}" -ge 1 ]; then
            echo "CI for ${SHA} is still running. Wait for it to finish, then re-run deploy."
            echo "${response}" | jq -r '.workflow_runs[] | select(.status!="completed") | "- \(.status) \(.html_url)"'
            exit 1
          fi

          echo "No successful CI run for ${SHA}."
          echo "Push to ${{ inputs.branch }} (fast CI) or run workflow_dispatch on ${CI_WORKFLOW_FILE} (full CI), then deploy again."
          total="$(echo "${response}" | jq '.total_count')"
          if [ "${total}" = "0" ]; then
            echo "API returned zero workflow runs for this commit."
          else
            echo "${response}" | jq -r '.workflow_runs[] | "- \(.status)/\(.conclusion // "n/a") \(.html_url)"'
          fi
          exit 1

      # Self-hosted runner often uses docker.sock from a container (DooD):
      # - daemon bind-mounts the *host* /opt/... (missing → empty dirs → EISDIR)
      # - `docker run -v $PWD:/src` also resolves PWD on the *host* (empty) — cannot copy that way
      # Stream the checkout via tar stdin so the runner reads workspace and the daemon only mounts /dest.
      - name: Sync checkout onto Docker host deploy dir
        run: |
          set -euo pipefail
          docker stop ai-gateway ai-gateway-prometheus ai-gateway-grafana 2>/dev/null || true
          docker rm -f ai-gateway ai-gateway-prometheus ai-gateway-grafana 2>/dev/null || true

          docker run --rm \
            -e "DEPLOY_DIR=${DEPLOY_DIR}" \
            -v "${DEPLOY_DIR}:/dest" \
            alpine:3.20 \
            sh -c '
              set -euo pipefail
              for rel in gateway.config.yaml deployment/monitoring/prometheus.yml deployment/monitoring/alerts.yml; do
                if [ -d "/dest/$rel" ]; then
                  echo "Removing Docker junk directory on host: $rel"
                  rm -rf "/dest/$rel"
                fi
              done
              if [ -f /dest/.env ]; then cp -a /dest/.env /tmp/.env.bak; fi
              find /dest -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
              if [ -f /tmp/.env.bak ]; then mv /tmp/.env.bak /dest/.env; fi
              mkdir -p /dest/logs
            '

          echo "Streaming checkout → host ${DEPLOY_DIR} ..."
          tar -C "${PWD}" --exclude=.git --exclude=.env -cf - . \
            | docker run --rm -i -v "${DEPLOY_DIR}:/dest" alpine:3.20 \
              tar -C /dest -xf -

          docker run --rm \
            -e "DEPLOY_DIR=${DEPLOY_DIR}" \
            -v "${DEPLOY_DIR}:/dest:ro" \
            alpine:3.20 \
            sh -c '
              set -euo pipefail
              for rel in gateway.config.yaml deployment/monitoring/prometheus.yml deployment/monitoring/alerts.yml; do
                if [ ! -f "/dest/$rel" ]; then
                  echo "FATAL: expected regular file on Docker host: $DEPLOY_DIR/$rel"
                  ls -la /dest | head -50 || true
                  ls -la "$(dirname "/dest/$rel")" || true
                  exit 1
                fi
                echo "OK host bind source: $rel ($(wc -c < "/dest/$rel" | tr -d " ") bytes)"
              done
            '

      - name: Fetch secrets from Vault
        env:
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          set -euo pipefail

          login_response=$(curl -k -s --request POST \
            --data "{\"role_id\":\"${VAULT_ROLE_ID}\",\"secret_id\":\"${VAULT_SECRET_ID}\"}" \
            "${VAULT_ADDR}/v1/auth/approle/login")

          vault_token=$(echo "${login_response}" | jq -r '.auth.client_token // empty')
          if [ -z "${vault_token}" ]; then
            echo "Failed to authenticate with Vault"
            echo "${login_response}"
            exit 1
          fi

          secrets_response=$(curl -k -s -H "X-Vault-Token: ${vault_token}" \
            "${VAULT_ADDR}/v1/secret/data/${CONT_NAME}/${VAULT_ENV}")

          if ! echo "${secrets_response}" | jq -e '.data.data' >/dev/null; then
            echo "No secrets at secret/data/${CONT_NAME}/${VAULT_ENV}"
            echo "${secrets_response}"
            exit 1
          fi

          # Compose CLI reads .env from the job workspace; daemon bind-mounts need it on host too.
          echo "${secrets_response}" | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > .env
          chmod 600 .env
          secret_count=$(wc -l < .env | tr -d ' ')
          echo "Created workspace .env with ${secret_count} entries"

          docker run --rm -i \
            -v "${DEPLOY_DIR}:/dest" \
            alpine:3.20 \
            sh -c 'cat > /dest/.env && chmod 600 /dest/.env && echo "Synced .env to host deploy dir"' \
            < .env

      - name: Ensure Docker network
        run: docker network create ai-gateway-network 2>/dev/null || true

      - name: Build and deploy full stack
        run: |
          set -euo pipefail

          # Force bind sources to the host deploy dir (daemon FS), regardless of
          # where the Compose CLI resolves relative paths inside the runner.
          printf '%s\n' \
            'services:' \
            '  gateway:' \
            '    volumes:' \
            "      - ${DEPLOY_DIR}/gateway.config.yaml:/app/gateway.config.yaml:ro" \
            "      - ${DEPLOY_DIR}/logs:/app/logs" \
            '  prometheus:' \
            '    volumes:' \
            "      - ${DEPLOY_DIR}/deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            "      - ${DEPLOY_DIR}/deployment/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            '  grafana:' \
            '    volumes:' \
            "      - ${DEPLOY_DIR}/deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            "      - ${DEPLOY_DIR}/deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            > /tmp/deploy-host-binds.yml

          # Pipeline-only: also attach gateway to the shared host network
          # (ai-gateway-network stays from base compose — Compose merges network lists).
          printf '%s\n' \
            'services:' \
            '  gateway:' \
            '    networks:' \
            '      - main_network' \
            'networks:' \
            '  main_network:' \
            '    external: true' \
            '    name: main_network' \
            > /tmp/deploy-extra-networks.yml

          # Verify host files one last time (daemon's view) before up
          docker run --rm -v "${DEPLOY_DIR}:/dest:ro" alpine:3.20 \
            sh -c 'for f in gateway.config.yaml deployment/monitoring/prometheus.yml deployment/monitoring/alerts.yml; do
              test -f "/dest/$f" || { echo "FATAL host missing $f"; exit 1; }
              ls -la "/dest/$f"
            done'

          # Build only gateway service explicitly
          docker compose -p ai-provider-gateway \
            --env-file .env \
            -f deployment/docker/docker-compose.yml \
            -f deployment/docker/docker-compose.redis.yml \
            -f deployment/docker/docker-compose.monitoring.yml \
            -f /tmp/deploy-host-binds.yml \
            -f /tmp/deploy-extra-networks.yml \
            build gateway

          # Start all services (pull images for redis/prometheus/grafana)
          docker compose -p ai-provider-gateway \
            --env-file .env \
            -f deployment/docker/docker-compose.yml \
            -f deployment/docker/docker-compose.redis.yml \
            -f deployment/docker/docker-compose.monitoring.yml \
            -f /tmp/deploy-host-binds.yml \
            -f /tmp/deploy-extra-networks.yml \
            up -d --force-recreate --pull always

      - name: Health check
        run: |
          set -euo pipefail
          echo "Waiting for gateway readiness..."
          ready=false
          for i in $(seq 1 24); do
            if body=$(curl -sf http://ai-gateway:3000/api/v1/health/ready); then
              echo "${body}" | jq .
              if echo "${body}" | jq -e '.status == "ready"' >/dev/null; then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [ "${ready}" != "true" ]; then
            echo "Readiness check failed"
            docker compose -p ai-provider-gateway \
              --env-file .env \
              -f deployment/docker/docker-compose.yml \
              -f deployment/docker/docker-compose.redis.yml \
              -f deployment/docker/docker-compose.monitoring.yml \
              logs --tail=100 gateway || true
            exit 1
          fi

          echo "Deploy successful (ref: ${{ steps.revision.outputs.ref }})"

      # Wipe secrets from the Actions job workspace only — do NOT remove
      # /opt/ai-provider-gateway/.env (host bind used by Compose).
      - name: Cleanup workspace secrets
        if: always()
        run: |
          set -euo pipefail
          echo "Removing job workspace .env (if present): ${GITHUB_WORKSPACE}/.env"
          rm -f "${GITHUB_WORKSPACE}/.env"
          rm -f /tmp/deploy-host-binds.yml
          rm -f /tmp/deploy-extra-networks.yml
          if [ -f "${GITHUB_WORKSPACE}/.env" ]; then
            echo "WARNING: ${GITHUB_WORKSPACE}/.env still exists after rm"
            exit 1
          fi
          echo "Workspace .env cleaned"
