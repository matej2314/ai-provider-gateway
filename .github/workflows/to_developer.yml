# Gate for merges into developer (staging).
# Require the "Developer gate" check in branch protection / rulesets.
name: Protect Developer

on:
  pull_request:
    branches:
      - developer
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: to-developer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  MASTER_KEY: ${{ secrets.MASTER_KEY }}
  MASTER_KEY_TEST: ${{ secrets.MASTER_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_API_KEY_TEST: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GOOGLE_API_KEY_TEST: ${{ secrets.GOOGLE_API_KEY }}
  GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:cov

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e

  # Single required status check for branch protection.
  gate:
    name: Developer gate
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    if: always()
    steps:
      - name: Require lint, unit, and e2e success
        run: |
          set -euo pipefail
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit: ${{ needs.test.result }}"
          echo "E2E:  ${{ needs.e2e.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
